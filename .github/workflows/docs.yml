name: Docs

# Builds the mdBook in docs/ and publishes it to GitHub Pages, on every push to
# main that changes the docs (or a manual run). The mdBook version is pinned so
# the site matches what a local build shows.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.5.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "$url" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # This fork's site hosts the Korean manual. The English manual lives on the
      # original project's site, so drop its chapter from the table of contents
      # and use a landing page without English links (docs/site/introduction.md).
      # SUMMARY.md and introduction.md stay as upstream has them, so merges from
      # upstream do not conflict.
      - name: Leave the English manual out of the site
        run: |
          cp docs/site/introduction.md docs/src/introduction.md
          awk '/^# User Manual \(English\)/ {skip=1; next} /^# / {skip=0} !skip' docs/src/SUMMARY.md > "$RUNNER_TEMP/SUMMARY.md"
          mv "$RUNNER_TEMP/SUMMARY.md" docs/src/SUMMARY.md
          if grep -q 'user/en/' docs/src/SUMMARY.md docs/src/introduction.md; then
            echo "English pages are still linked" >&2
            exit 1
          fi

      - name: Build the book
        run: |
          mdbook build docs
          rm -rf docs/book/user/en

      # mdBook gives every page the book's single language (en). Pages under
      # user/<lang>/ get their own, so screen readers speak them in that language.
      - name: Mark translated pages with their language
        run: |
          for lang in de ko; do
            [ -d "docs/book/user/$lang" ] || continue
            find "docs/book/user/$lang" -name '*.html' -exec sed -i "s/<html lang=\"en\"/<html lang=\"$lang\"/" {} +
          done
          # The landing page is Korean first (its German part carries lang="de").
          sed -i 's/<html lang="en"/<html lang="ko"/' docs/book/index.html docs/book/introduction.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
